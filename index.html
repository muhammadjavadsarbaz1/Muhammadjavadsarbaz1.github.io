<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طوبی | فروشگاه عطر</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #0b3d2e;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .hero {
      padding: 50px 20px;
      text-align: center;
      background: white;
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 25px;
      max-width: 1000px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
    }

    .product h3 {
      margin: 15px 0 8px;
    }

    .price {
      font-weight: bold;
      color: #0b3d2e;
      font-size: 18px;
    }

    .buy {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 20px;
      background: #0b3d2e;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      margin-top: 30px;
      padding: 25px;
      text-align: center;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>طوبی</h1>
  <p>فروشگاه تخصصی عطر و اسانس</p>
</header>

<section class="hero">
  <h2>عطر مورد علاقه‌ات را پیدا کن</h2>
  <p>انتخابی خاص برای سلیقه‌ای خاص</p>
</section>

<section class="products">

  <div class="product">
    <img src="https://via.placeholder.com/500x500?text=Perfume" alt="عطر">
    <h3>نام عطر</h3>
    <p>توضیح کوتاه درباره عطر</p>
    <div class="price">قیمت: تماس بگیرید</div>
    <a class="buy" href="#">خرید</a>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/500x500?text=Perfume" alt="عطر">
    <h3>نام عطر</h3>
    <p>توضیح کوتاه درباره عطر</p>
    <div class="price">قیمت: تماس بگیرید</div>
    <a class="buy" href="#">خرید</a>
  </div>

</section>

<footer>
  © 2026 فروشگاه عطر طوبی
</footer>

</body>
</html>
